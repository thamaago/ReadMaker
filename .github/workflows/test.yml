name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '2x'

      - name: Install test dependencies
        working-directory: tests
        run: npm install

      - name: Run headless test suites
        working-directory: tests
        run: npm test

